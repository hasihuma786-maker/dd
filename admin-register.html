<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অ্যাডমিন রেজিস্ট্রেশন | মেডিলিংক</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
    }
    
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 2.5rem;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
      width: 100%;
      animation: fadeInUp 0.6s ease-out;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    h2 {
      text-align: center;
      margin-bottom: 0.5rem;
      color: #1e3c72;
    }
    
    .subtitle {
      text-align: center;
      color: #2ba0c4;
      margin-bottom: 1.5rem;
    }
    
    .form-group {
      margin-bottom: 1.2rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #1e3c72;
    }
    
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 1rem;
      transition: 0.2s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #2ba0c4;
      box-shadow: 0 0 0 3px rgba(43, 160, 196, 0.2);
    }
    
    .btn-primary {
      width: 100%;
      background: linear-gradient(95deg, #0b4f6c, #2ba0c4);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    
    .btn-primary:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 14px rgba(0, 110, 130, 0.3);
    }
    
    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    
    .message-box {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 16px;
      text-align: center;
    }
    
    .message-box.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }
    
    .message-box.error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }
    
    .message-box.warning {
      background: #fff3e0;
      color: #e65100;
      border: 1px solid #ffcc80;
    }
    
    hr {
      margin: 1.5rem 0;
      border: none;
      border-top: 1px solid #ddd;
    }
    
    .footer-links {
      text-align: center;
      margin-top: 1rem;
    }
    
    .footer-links a {
      color: #2ba0c4;
      text-decoration: none;
    }
    
    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase.js"></script>
</head>
<body>

<div class="container">
  <div class="glass-card">
    <h2>👑 অ্যাডমিন রেজিস্ট্রেশন</h2>
    <p class="subtitle">মেডিলিংক অ্যাডমিন প্যানেলের জন্য নিবন্ধন</p>
    
    <form id="adminRegisterForm">
      <div class="form-group">
        <label>পূর্ণ নাম *</label>
        <input type="text" id="fullname" required placeholder="আপনার নাম লিখুন">
      </div>
      
      <div class="form-group">
        <label>ইমেইল *</label>
        <input type="email" id="email" required placeholder="admin@example.com">
      </div>
      
      <div class="form-group">
        <label>পাসওয়ার্ড * (৬ অক্ষরের বেশি)</label>
        <input type="password" id="password" required minlength="6" placeholder="পাসওয়ার্ড দিন">
      </div>
      
      <div class="form-group">
        <label>পাসওয়ার্ড নিশ্চিত করুন *</label>
        <input type="password" id="confirmPassword" required placeholder="আবার পাসওয়ার্ড দিন">
      </div>
      
      <div class="form-group">
        <label>মোবাইল নম্বর (ঐচ্ছিক)</label>
        <input type="tel" id="phone" placeholder="01XXXXXXXXX">
      </div>
      
      <button type="submit" class="btn-primary" id="submitBtn">অ্যাডমিন নিবন্ধন করুন →</button>
    </form>
    
    <div id="messageBox" class="message-box"></div>
    
    <hr>
    
    <div class="footer-links">
      <p>ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="admin-login.html">অ্যাডমিন লগইন</a></p>
      <p><a href="index.html">← হোমপেজে ফিরুন</a></p>
    </div>
  </div>
</div>

<script>
  function showMessage(msg, type) {
    const box = document.getElementById('messageBox');
    box.className = `message-box ${type}`;
    box.innerHTML = msg;
    box.style.display = 'block';
    
    setTimeout(() => {
      box.style.display = 'none';
    }, 5000);
  }
  
  document.getElementById('adminRegisterForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const fullname = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const phone = document.getElementById('phone').value.trim();
    
    // Validation
    if(!fullname || !email || !password) {
      showMessage('সব ঘর পূরণ করুন', 'error');
      return;
    }
    
    if(password !== confirm) {
      showMessage('পাসওয়ার্ড মিলছে না', 'error');
      return;
    }
    
    if(password.length < 6) {
      showMessage('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে', 'error');
      return;
    }
    
    const submitBtn = document.getElementById('submitBtn');
    const originalText = submitBtn.innerText;
    submitBtn.innerText = 'নিবন্ধন হচ্ছে...';
    submitBtn.disabled = true;
    
    try {
      // STEP 1: Create admin user in Auth
      const { data: authData, error: authError } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: { 
            full_name: fullname, 
            role: 'admin',
            phone: phone 
          }
        }
      });
      
      if(authError) {
        if(authError.message.includes('already registered')) {
          showMessage('এই ইমেইল দিয়ে ইতিমধ্যে অ্যাকাউন্ট আছে। লগইন করুন।', 'error');
          setTimeout(() => {
            window.location.href = 'admin-login.html';
          }, 2000);
        } else {
          showMessage('নিবন্ধন ব্যর্থ: ' + authError.message, 'error');
        }
        return;
      }
      
      showMessage('✅ অ্যাকাউন্ট তৈরি হয়েছে! অ্যাডমিন রোল যোগ করা হচ্ছে...', 'success');
      
      // STEP 2: Add to admins table
      const { error: adminError } = await supabaseClient
        .from('admins')
        .insert([{
          name: fullname,
          email: email,
          role: 'admin',
          created_at: new Date()
        }]);
      
      if(adminError) {
        console.error('Admin table error:', adminError);
        showMessage('⚠️ অ্যাকাউন্ট তৈরি হয়েছে কিন্তু অ্যাডমিন টেবিলে যোগ করতে সমস্যা। তবুও লগইন চেষ্টা করুন।', 'warning');
      } else {
        console.log('Admin added to admins table successfully');
      }
      
      // STEP 3: Try auto login
      showMessage('✅ অ্যাডমিন অ্যাকাউন্ট তৈরি হয়েছে! লগইন হচ্ছে...', 'success');
      
      const { error: loginError } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });
      
      if(!loginError) {
        setTimeout(() => {
          window.location.href = 'admin-dashboard.html';
        }, 1500);
      } else {
        showMessage('✅ অ্যাকাউন্ট তৈরি হয়েছে! এখন লগইন করুন।', 'success');
        setTimeout(() => {
          window.location.href = 'admin-login.html';
        }, 2000);
      }
      
    } catch(error) {
      console.error('Registration error:', error);
      showMessage('ত্রুটি: ' + error.message, 'error');
    } finally {
      submitBtn.innerText = originalText;
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
