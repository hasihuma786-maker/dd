<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>অ্যাডমিন লগইন | মেডিলিংক</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
    }
    
    .container {
      max-width: 450px;
      margin: 0 auto;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 2.5rem;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
      width: 100%;
    }
    
    h2 {
      text-align: center;
      margin-bottom: 0.5rem;
      color: #1e3c72;
    }
    
    .subtitle {
      text-align: center;
      color: #2ba0c4;
      margin-bottom: 1.5rem;
    }
    
    .form-group {
      margin-bottom: 1.2rem;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #1e3c72;
    }
    
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 1rem;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #2ba0c4;
    }
    
    .btn-primary {
      width: 100%;
      background: linear-gradient(95deg, #0b4f6c, #2ba0c4);
      color: white;
      padding: 14px;
      border: none;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    
    .btn-primary:hover {
      transform: scale(1.02);
    }
    
    .error-box {
      display: none;
      margin-top: 1rem;
      padding: 0.75rem;
      background: #ffebee;
      color: #c62828;
      border-radius: 12px;
      text-align: center;
    }
    
    hr {
      margin: 1.5rem 0;
      border-top: 1px solid #ddd;
    }
    
    .footer-links {
      text-align: center;
      margin-top: 1rem;
    }
    
    .footer-links a {
      color: #2ba0c4;
      text-decoration: none;
    }
    
    small {
      cursor: pointer;
      color: #2ba0c4;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase.js"></script>
</head>
<body>

<div class="container">
  <div class="glass-card">
    <h2>🔐 অ্যাডমিন লগইন</h2>
    <p class="subtitle">আপনার অ্যাডমিন অ্যাকাউন্টে লগইন করুন</p>
    
    <form id="adminLoginForm">
      <div class="form-group">
        <label>ইমেইল</label>
        <input type="email" id="email" required placeholder="admin@example.com">
      </div>
      
      <div class="form-group">
        <label>পাসওয়ার্ড</label>
        <input type="password" id="password" required placeholder="পাসওয়ার্ড দিন">
        <small onclick="togglePassword()">👁️ দেখাও/লুকাও</small>
      </div>
      
      <button type="submit" class="btn-primary">লগইন →</button>
    </form>
    
    <div id="errorBox" class="error-box"></div>
    
    <hr>
    
    <div class="footer-links">
      <p>নতুন অ্যাডমিন? <a href="admin-register.html">নিবন্ধন করুন</a></p>
      <p><a href="index.html">← হোমপেজে ফিরুন</a></p>
    </div>
  </div>
</div>

<script>
  function togglePassword() {
    const pwd = document.getElementById('password');
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
  }
  
  document.getElementById('adminLoginForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('errorBox');
    
    if(!email || !password) {
      errorBox.style.display = 'block';
      errorBox.innerText = 'ইমেইল এবং পাসওয়ার্ড দিন';
      return;
    }
    
    const submitBtn = e.target.querySelector('button');
    const originalText = submitBtn.innerText;
    submitBtn.innerText = 'লগইন হচ্ছে...';
    submitBtn.disabled = true;
    errorBox.style.display = 'none';
    
    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });
      
      if(error) {
        errorBox.style.display = 'block';
        errorBox.innerText = '❌ লগইন ব্যর্থ: ' + error.message;
        return;
      }
      
      // Check if user is admin
      const { data: adminData, error: adminError } = await supabaseClient
        .from('admins')
        .select('role, name')
        .eq('email', email)
        .maybeSingle();
      
      if(adminError || !adminData) {
        errorBox.style.display = 'block';
        errorBox.innerText = '❌ আপনি অ্যাডমিন নন। অনুগ্রহ করে অ্যাডমিন রেজিস্ট্রেশন করুন।';
        await supabaseClient.auth.signOut();
        return;
      }
      
      errorBox.style.display = 'block';
      errorBox.style.background = '#e8f5e9';
      errorBox.style.color = '#2e7d32';
      errorBox.innerText = '✅ লগইন সফল! ড্যাশবোর্ডে নিয়ে যাচ্ছি...';
      
      setTimeout(() => {
        window.location.href = 'admin-dashboard.html';
      }, 1000);
      
    } catch(error) {
      errorBox.style.display = 'block';
      errorBox.innerText = 'ত্রুটি: ' + error.message;
    } finally {
      submitBtn.innerText = originalText;
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
