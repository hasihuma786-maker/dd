<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | MediLink</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase.js"></script>
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">

<div class="container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  <div class="glass-card" style="max-width: 450px; width: 90%; padding: 2.5rem;">
    <h2 style="text-align: center;">Create Account</h2>
    <form id="signupForm">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullname" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Password (min 6 chars)</label>
        <input type="password" id="password" required minlength="6">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" required>
      </div>
      <button type="submit" class="btn-primary" style="width: 100%;">Sign Up →</button>
    </form>
    <p style="text-align: center; margin-top: 1rem;">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<script>
  document.getElementById('signupForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fullname = document.getElementById('fullname').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    
    if(password !== confirm) {
      alert('Passwords do not match');
      return;
    }
    
    const { data, error } = await supabaseClient.auth.signUp({
      email, password,
      options: { data: { full_name: fullname } }
    });
    
    if(error) {
      alert('Signup failed: ' + error.message);
    } else {
      alert('Account created! Please check your email for verification.');
      window.location.href = 'login.html';
    }
  });
</script>
</body>
</html>
