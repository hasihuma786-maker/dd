<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | MediLink</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script><script src="supabase.js"></script></head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
<div class="container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  <div class="glass-card" style="max-width: 450px; width: 90%; padding: 2.5rem;">
    <h2 style="text-align: center;">Welcome Back</h2>
    <form id="loginForm"><div class="form-group"><label>Email</label><input type="email" id="email" required></div><div class="form-group"><label>Password</label><input type="password" id="password" required></div><button type="submit" class="btn-primary" style="width:100%;">Login →</button></form>
    <p style="text-align:center; margin-top:1rem;">New user? <a href="signup.html">Create Account</a></p>
  </div>
</div>
<script>
  document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error) alert('Login failed: ' + error.message);
    else window.location.href = 'index.html';
  });
</script>
</body>
</html>
