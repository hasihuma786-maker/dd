<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Login | MediLink</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script><script src="supabase.js"></script></head>
<body style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
<div class="container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  <div class="glass-card" style="max-width: 450px; width: 90%; padding: 2.5rem;">
    <h2 style="text-align: center;">🔐 Admin Portal</h2>
    <form id="adminLoginForm"><div class="form-group"><label>Email</label><input type="email" id="email" required></div><div class="form-group"><label>Password</label><input type="password" id="password" required></div><button type="submit" class="btn-primary" style="width:100%;">Login as Admin →</button></form>
    <p style="text-align:center; margin-top:1rem;"><a href="index.html">← Back to Homepage</a></p>
  </div>
</div>
<script>
  document.getElementById('adminLoginForm')?.addEventListener('submit', async (e) => {
    e.preventDefault(); const email = document.getElementById('email').value; const password = document.getElementById('password').value;
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if(error) { alert('Login failed: ' + error.message); return; }
    const { data: adminData } = await supabaseClient.from('admins').select('role').eq('email', email).maybeSingle();
    if(!adminData) { alert('Access denied. Not an admin account.'); await supabaseClient.auth.signOut(); return; }
    window.location.href = 'admin-dashboard.html';
  });
</script>
</body>
</html>
