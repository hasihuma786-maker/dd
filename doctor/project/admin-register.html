<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Registration | MediLink</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase.js"></script>
</head>
<body style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">

<div class="container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  <div class="glass-card" style="max-width: 500px; width: 90%; padding: 2.5rem;">
    <h2 style="text-align: center;">Admin Registration</h2>
    <form id="adminRegisterForm">
      <div class="form-group"><label>Full Name</label><input type="text" id="fullname" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
      <div class="form-group"><label>Password (min 6 chars)</label><input type="password" id="password" required minlength="6"></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" id="confirmPassword" required></div>
      <div class="form-group"><label>Secret Admin Code</label><input type="password" id="secretCode" required placeholder="Enter admin code"></div>
      <button type="submit" class="btn-primary" style="width:100%;">Register as Admin</button>
    </form>
    <p style="text-align:center; margin-top:1rem;">Already have access? <a href="admin-login.html">Admin Login</a></p>
  </div>
</div>

<script>
  const ADMIN_SECRET = "CREATE_ADMIN_2026";
  
  document.getElementById('adminRegisterForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fullname = document.getElementById('fullname').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const secret = document.getElementById('secretCode').value;
    
    if(password !== confirm) {
      alert('Passwords do not match');
      return;
    }
    
    if(secret !== ADMIN_SECRET) {
      alert('Invalid admin secret code');
      return;
    }
    
    // Create auth user
    const { data, error } = await supabaseClient.auth.signUp({
      email, password,
      options: { data: { full_name: fullname, role: 'admin' } }
    });
    
    if(error) {
      alert('Registration failed: ' + error.message);
      return;
    }
    
    // Add to admins table
    const { error: adminError } = await supabaseClient.from('admins').insert({
      name: fullname,
      email: email,
      role: 'admin',
      created_at: new Date()
    });
    
    if(adminError) {
      console.error('Admin table error:', adminError);
      alert('Admin registered but with partial data. Please contact support.');
    } else {
      alert('Admin registered successfully! Please login.');
      window.location.href = 'admin-login.html';
    }
  });
</script>
</body>
</html>
