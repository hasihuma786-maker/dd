<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Doctor Profile | MediLink</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="supabase.js"></script>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <div class="logo">🏥 MediLink</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <button id="darkModeToggle" class="btn-outline">🌙</button>
    </div>
  </div>
</nav>

<div class="container" style="padding: 2rem 1rem; max-width: 800px;">
  <div class="glass-card" style="padding: 2rem;">
    <h2>Add Your Doctor Profile</h2>
    <p style="margin-bottom: 1rem;">Your profile will be reviewed by admin before going live.</p>
    
    <form id="doctorForm">
      <div class="form-group"><label>Full Name *</label><input type="text" id="name" required></div>
      <div class="form-group"><label>Specialty *</label>
        <select id="specialty" required><option>Dentist</option><option>Cardiologist</option><option>Neurologist</option><option>Orthopedic</option><option>Gynecologist</option><option>Pediatrician</option></select>
      </div>
      <div class="form-group"><label>City *</label><input type="text" id="city" required placeholder="Kolkata, Delhi, Mumbai..."></div>
      <div class="form-group"><label>Hospital / Clinic</label><input type="text" id="hospital"></div>
      <div class="form-group"><label>Years of Experience</label><input type="number" id="experience"></div>
      <div class="form-group"><label>Consultation Fee (₹)</label><input type="number" id="fees"></div>
      <div class="form-group"><label>About Doctor</label><textarea id="about" rows="4"></textarea></div>
      <div class="form-group"><label>Image URL (optional)</label><input type="text" id="image" placeholder="https://..."></div>
      <div class="form-group"><label><input type="checkbox" id="available"> Available for appointments</label></div>
      <button type="submit" class="btn-primary">Submit for Approval</button>
    </form>
  </div>
</div>

<script>
  async function checkAuth() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) window.location.href = 'login.html';
    return user;
  }
  
  document.getElementById('doctorForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = await checkAuth();
    
    const doctorData = {
      name: document.getElementById('name').value,
      specialty: document.getElementById('specialty').value,
      city: document.getElementById('city').value,
      hospital: document.getElementById('hospital').value,
      experience: parseInt(document.getElementById('experience').value) || 0,
      fees: parseInt(document.getElementById('fees').value) || 0,
      about: document.getElementById('about').value,
      image: document.getElementById('image').value || 'https://via.placeholder.com/300',
      available: document.getElementById('available').checked,
      approved: false,
      rating: 4.0,
      email: user.email,
      created_at: new Date()
    };
    
    const { error } = await supabaseClient.from('doctors').insert(doctorData);
    if(error) {
      alert('Error: ' + error.message);
    } else {
      alert('Profile submitted! Admin will review and approve within 24 hours.');
      window.location.href = 'dashboard.html';
    }
  });
  
  document.getElementById('darkModeToggle')?.addEventListener('click', () => document.body.classList.toggle('dark'));
  checkAuth();
</script>
</body>
</html>
